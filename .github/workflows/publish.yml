name: Release

on:
  push:
    tags:
      - "core@*"
      - "cli@*"
      - "browser@*"
      - "markdown@*"
      - "wire-lang@*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package for a dry run on a branch; package tags select their own target"
        required: true
        default: "browser"
        type: choice
        options:
          - core
          - cli
          - browser
          - markdown
          - wire-lang
      mode:
        description: "Run a dry-run publish check, or publish to npm"
        required: true
        default: "dry-run"
        type: choice
        options:
          - "dry-run"
          - "publish"
      npm_tag:
        description: "npm dist-tag to use when publishing"
        required: true
        default: "latest"

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    # Gates real publishes behind the "release" environment's required reviewers,
    # and is the environment matched by the npm trusted publisher configuration.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select and validate release target
        id: target
        env:
          RELEASE_PACKAGE: ${{ inputs.package }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: node scripts/release-target.mjs

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1.
          node-version: 24
          # No registry-url: setting it makes setup-node write an .npmrc with
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and inject a
          # placeholder NODE_AUTH_TOKEN. npm then authenticates with that bogus
          # token instead of doing the OIDC exchange, and the publish fails with
          # a masked E404. npm defaults to registry.npmjs.org, which trusted
          # publishing targets, so the registry does not need to be set here.
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release checks
        run: pnpm release:check

      - name: Dry-run publish
        env:
          RELEASE_PACKAGE: ${{ steps.target.outputs.name }}
          NPM_DIST_TAG: ${{ inputs.npm_tag || 'latest' }}
        run: pnpm --filter "$RELEASE_PACKAGE" publish --dry-run --no-git-checks --access public --tag "$NPM_DIST_TAG"

      - name: Verify trusted publishing environment
        if: github.event_name == 'push' || inputs.mode == 'publish'
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || {
            echo "Missing GitHub OIDC request URL. Check id-token: write for the release job." >&2
            exit 1
          }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || {
            echo "Missing GitHub OIDC request token. Check id-token: write for the release job." >&2
            exit 1
          }

      # No NODE_AUTH_TOKEN / NPM_TOKEN: auth is via OIDC trusted publishing.
      # npm does not understand the workspace: protocol, so pin workspace:* deps
      # to real versions first, then publish each package from its own directory.
      # A directory publish — not `npm publish <tarball>` — is what lets npm's
      # OIDC token exchange engage; npm attaches provenance automatically.
      - name: Publish to npm
        if: github.event_name == 'push' || inputs.mode == 'publish'
        env:
          RELEASE_DIRECTORY: ${{ steps.target.outputs.directory }}
          NPM_DIST_TAG: ${{ inputs.npm_tag || 'latest' }}
        run: |
          set -euo pipefail
          node scripts/pin-workspace-deps.mjs
          cd "packages/$RELEASE_DIRECTORY"
          npm publish --provenance --access public --tag "$NPM_DIST_TAG"
