<g class="wire-component" data-wire-kind="component" data-wire-id="D1" data-wire-type="Diode" data-wire-symbol="diode" id="wire-component-D1"><path class="wire-symbol" fill="none" d="M 36 47 L 61 47"/><path class="wire-symbol" fill="none" d="M 75 47 L 100 47"/><polygon class="wire-symbol-fill" points="61,39 61,55 75,47" fill="#1f2937"/><line class="wire-symbol" x1="75" y1="39" x2="75" y2="55"/><text class="wire-label" x="68" y="30" text-anchor="middle">D1</text></g><g class="wire-component" data-wire-kind="component" data-wire-id="R1" data-wire-type="Resistor" data-wire-symbol="resistor" id="wire-component-R1"><path class="wire-symbol" fill="none" d="M 152 47 L 166 47 L 169 40 L 175 54 L 181 40 L 187 54 L 193 40 L 199 54 L 202 47 L 216 47"/><text class="wire-label" x="184" y="30" text-anchor="middle">R1</text><text class="wire-label" x="184" y="17" text-anchor="middle">1k</text></g>
