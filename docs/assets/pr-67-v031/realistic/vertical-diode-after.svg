<svg xmlns="http://www.w3.org/2000/svg" class="wire-lang" viewBox="0 0 298 190" width="298" height="190" role="img" data-wire-lang-version="0.3.1">
<title>Wire Lang schematic</title>
<desc>A schematic with 3 components.</desc>
<style>.wire-lang { background: #ffffff; }
.wire-wire { stroke: #1f2937; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.wire-symbol { stroke: #1f2937; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.wire-symbol-bg { stroke: #1f2937; stroke-width: 1.5; fill: #ffffff; }
.wire-symbol-fill { fill: #1f2937; stroke: none; }
.wire-junction { fill: #1f2937; }
.wire-label { fill: #111827; font: 600 11px var(--wire-font, system-ui, sans-serif); }
.wire-pin-label { fill: #374151; font: 9px var(--wire-font, system-ui, sans-serif); }
.wire-net-label { fill: #2563eb; font: 600 10px var(--wire-font, system-ui, sans-serif); }
.wire-annotation { fill: #6b7280; font: italic 10px var(--wire-font, system-ui, sans-serif); }</style>
<rect class="wire-background" x="0" y="0" width="298" height="190" fill="#ffffff"/>
<g class="wire-wires"><g class="wire-net" data-wire-kind="net" data-wire-style="label" data-wire-net="GND"><line class="wire-wire" x1="163" y1="126" x2="163" y2="144"/><line class="wire-wire" x1="244" y1="79" x2="244" y2="61"/></g><g class="wire-net" data-wire-kind="net" data-wire-style="wire" data-wire-net="BIAS"><line class="wire-wire" x1="100" y1="36" x2="163" y2="36"/><line class="wire-wire" x1="100" y1="94" x2="100" y2="36"/><line class="wire-wire" x1="163" y1="62" x2="163" y2="36"/></g></g>
