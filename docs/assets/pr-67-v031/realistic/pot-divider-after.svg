<svg xmlns="http://www.w3.org/2000/svg" class="wire-lang" viewBox="0 0 370 216" width="370" height="216" role="img" data-wire-lang-version="0.3.1">
<title>Loaded potentiometer divider</title>
<desc>A 10k potentiometer divides 5V; a 4k7 rheostat loads its OUT node to ground.</desc>
<style>.wire-lang { background: #ffffff; }
.wire-wire { stroke: #1f2937; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.wire-symbol { stroke: #1f2937; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.wire-symbol-bg { stroke: #1f2937; stroke-width: 1.5; fill: #ffffff; }
.wire-symbol-fill { fill: #1f2937; stroke: none; }
.wire-junction { fill: #1f2937; }
.wire-label { fill: #111827; font: 600 11px var(--wire-font, system-ui, sans-serif); }
.wire-pin-label { fill: #374151; font: 9px var(--wire-font, system-ui, sans-serif); }
.wire-net-label { fill: #2563eb; font: 600 10px var(--wire-font, system-ui, sans-serif); }
.wire-annotation { fill: #6b7280; font: italic 10px var(--wire-font, system-ui, sans-serif); }</style>
<rect class="wire-background" x="0" y="0" width="370" height="216" fill="#ffffff"/>
<g class="wire-wires"><g class="wire-net" data-wire-kind="net" data-wire-style="label" data-wire-net="GND"><line class="wire-wire" x1="148" y1="152" x2="148" y2="170"/><line class="wire-wire" x1="235" y1="152" x2="235" y2="170"/><line class="wire-wire" x1="316" y1="105" x2="316" y2="87"/></g><g class="wire-net" data-wire-kind="net" data-wire-style="wire" data-wire-net="5V"><line class="wire-wire" x1="54" y1="62" x2="148" y2="62"/><line class="wire-wire" x1="54" y1="105" x2="54" y2="62"/><line class="wire-wire" x1="148" y1="88" x2="148" y2="62"/></g><g class="wire-net" data-wire-kind="net" data-wire-style="wire" data-wire-net="OUT"><line class="wire-wire" x1="172" y1="36" x2="235" y2="36"/><line class="wire-wire" x1="172" y1="120" x2="172" y2="36"/><line class="wire-wire" x1="235" y1="88" x2="235" y2="36"/></g></g>
<g class="wire-component" data-wire-kind="component" data-wire-id="PWR1" data-wire-type="PowerFlag" data-wire-symbol="power-flag" id="wire-component-PWR1"><path class="wire-symbol" fill="none" d="M 54 127.5 L 54 108.5"/><polygon class="wire-symbol-fill" points="54,105 56.2,108.5 51.8,108.5"/><text class="wire-label" x="54" y="133.5" text-anchor="middle">5V</text></g><g class="wire-component" data-wire-kind="component" data-wire-id="RV1" data-wire-type="Potentiometer" data-wire-symbol="potentiometer" id="wire-component-RV1"><path class="wire-symbol" fill="none" d="M 148 88 L 148 102 L 155 105 L 141 111 L 155 117 L 141 123 L 155 129 L 141 135 L 148 138 L 148 152"/><path class="wire-symbol" fill="none" d="M 172 120 L 151.5 120"/><polygon class="wire-symbol-fill" points="148,120 151.5,122.2 151.5,117.8"/><text class="wire-label" x="130" y="117.5" text-anchor="end">RV1</text><text class="wire-label" x="130" y="130.5" text-anchor="end">10k</text></g><g class="wire-component" data-wire-kind="component" data-wire-id="RH1" data-wire-type="Rheostat" data-wire-symbol="rheostat" id="wire-component-RH1"><path class="wire-symbol" fill="none" d="M 235 88 L 235 102 L 242 105 L 228 111 L 242 117 L 228 123 L 242 129 L 228 135 L 235 138 L 235 152"/><path class="wire-symbol" fill="none" d="M 222 108 L 245.43 129.63"/><polygon class="wire-symbol-fill" points="248,132 243.94,131.24 246.92,128.01"/><text class="wire-label" x="252" y="117.5" text-anchor="start">RH1</text><text class="wire-label" x="252" y="130.5" text-anchor="start">4k7</text></g><g class="wire-component" data-wire-kind="component" data-wire-id="G1" data-wire-type="GroundReference" data-wire-symbol="ground-reference" id="wire-component-G1"><path class="wire-symbol" fill="none" d="M 316 105 L 316 111.75"/><line class="wire-symbol" x1="328" y1="111.75" x2="304" y2="111.75"/><line class="wire-symbol" x1="324" y1="115.2" x2="308" y2="115.2"/><line class="wire-symbol" x1="320" y1="118.5" x2="312" y2="118.5"/></g>
<g class="wire-labels"><text class="wire-net-label" x="148" y="180" text-anchor="middle">GND</text><text class="wire-net-label" x="235" y="180" text-anchor="middle">GND</text><text class="wire-net-label" x="316" y="83" text-anchor="middle">GND</text><text class="wire-annotation" x="203.5" y="48" text-anchor="middle">OUT</text></g>
